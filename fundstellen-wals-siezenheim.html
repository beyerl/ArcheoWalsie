<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Archaeological Finds – Wals-Siezenheim</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  :root{--bg:#fbfaf7;--ink:#24211d;--muted:#6f685f;--line:#e2ddd4;--accent:#b5462b;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;background:rgba(251,250,247,.96);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
  #top{top:10px;left:10px;right:10px;max-width:440px;padding:10px 12px}
  #top h1{font-size:15px;margin:0 0 2px;letter-spacing:.01em}
  #top .sub{font-size:12px;color:var(--muted)}
  #status{font-size:13px;margin-top:6px}
  #status b{font-variant-numeric:tabular-nums}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--ink)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #sheet{left:10px;right:10px;bottom:10px;max-width:440px;max-height:42vh;display:flex;flex-direction:column}
  #sheet header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer}
  #list{overflow:auto;padding:4px 0}
  #sheet.collapsed #list,#sheet.collapsed #filters{display:none}
  .item{display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:13px;cursor:pointer}
  .item:hover{background:#f1ede6}
  .item .d{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  .arrow{display:inline-block;width:14px;text-align:center}
  .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
  #filters{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;gap:5px;user-select:none}
  .chip.off{opacity:.35}
  .opac{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .opac input{width:90px}
  .fm{display:flex;align-items:center;justify-content:center}
  .fm svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
  .me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
  .leaflet-popup-content{font-size:13px;line-height:1.45}
  .leaflet-popup-content h3{margin:0 0 4px;font-size:14px}
  .muted{color:var(--muted)}
  #toast{position:absolute;z-index:1100;left:50%;transform:translateX(-50%);top:120px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;display:none}
  #info{display:none;position:absolute;z-index:1200;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;padding:16px}
  #info .card{background:#fff;border-radius:12px;max-width:460px;padding:16px 18px;font-size:13.5px;line-height:1.5}
  #info h2{font-size:16px;margin:0 0 8px}
  .priv{margin-top:6px;font-size:12px;color:#8a4b00;background:#fff4e0;border-radius:6px;padding:4px 7px}
  #btnMenu{margin-left:auto;font-size:16px;line-height:1;padding:5px 11px}
  @media (max-width:899px){
    .leaflet-top.leaflet-right{top:calc(var(--topH,60px) + 10px)}.leaflet-bottom.leaflet-left{bottom:56px}
    #top .bar{margin-top:0}
    #top.quiet #status{display:none}
    #menu{display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
    #top.open #menu{display:block}
    #menu .row:first-of-type{margin-top:8px}
  }
  @media (min-width:900px){#top{display:flex;flex-direction:column}#menu{display:contents}#btnMenu{display:none}#menu h1{order:0}#menu .sub{order:1}#status{order:2}#top .bar{order:3}#menu .row{order:4}.leaflet-top.leaflet-right{right:375px}#sheet{left:auto;right:10px;top:10px;bottom:auto;max-height:calc(100vh - 20px);width:360px}#top{right:auto}}
  .lit{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px}
  .lit ul{margin:2px 0 0;padding-left:16px}
  .lit li{margin:2px 0}
  #btnLang{margin-left:auto;letter-spacing:.03em}
  #btnLang span{color:var(--muted)}
  #btnLang span.cur{color:var(--ink);font-weight:700}
</style>
</head>

    </div>
  </div>
</div>

<div id="sheet" class="panel">
  <header id="sheetHead"><span id="sheetTitle"></span><span class="muted" id="sheetToggle">▾</span></header>
  <div id="filters"></div>
  <div id="list"></div>
</div>

<div id="toast"></div>

</div></div>

const LOIG=[47.78834,12.992338];       // centre of the villa area; the find cluster around it ends at ~400 m
const KLESSHEIM=[47.819885,12.992243]; // late Roman graves in the palace park
function litFor(f){
  const k=new Set(), add=(...x)=>x.forEach(y=>k.add(y)), {epoch:e,type:ty}=f;
  if(haversine(LOIG[0],LOIG[1],f.lat,f.lon)<=400)
    add('foe51','leiza','thalerhof','gutshof','hell62stamps','gruber22','gruber17','loig8182','thiasos','jobst82','hell61stamp');
  if(e==='Steinzeit') add('hell63axes');
  if(e==='Bronzezeit') add('foeBz');
  if(ty==='Hortfund') add('hell60swords');
  if(e==='Eisenzeit') add('foeLt');
  if(e==='Römerzeit'){
    add('foeRom');
    if(ty==='Grab') add('graves','hell62graves');
    if(ty==='Grab' && haversine(KLESSHEIM[0],KLESSHEIM[1],f.lat,f.lon)<=1000) add('hell48');
    if(['Siedlung','Haus','Produktionsstätte','Grab'].includes(ty)) add('gutshof');
    if(ty==='Einzelfund') add('hell61fib','hell74');
  }
  if(e==='Frühmittelalter') add('foeFma');
  if(ty==='Kirche' || ty==='Schloss') add('dehio');
  if(f.id===49) add('hell69','berndl');           // Pfarrkirche Wals: Roman relief at the entrance
  if(f.name==='Schloss Kleßheim') add('hell62graves','hell48');
  if(ty==='Schanze') add('mitterer00','mitterer99');
  if(ty==='Birnbaum') add('bechstein');
  return [...k].map(x=>LIT[x]);
}
function litHtml(f){
  const all=litFor(f), item=l=>`<li>${l.url?`<a href="${l.url}" target="_blank" rel="noopener">${l.t}</a>`:l.t}`+
    `<span class="muted">${l.en?'':t('inGerman')}${l.n?' – '+l.n[lang]:''}</span></li>`;
  const sec=(k,list)=>list.length?`<div class="lit"><b>${t(k)}</b><ul>${list.map(item).join('')}</ul></div>`:'';
  return sec('litTitle',all.filter(l=>l.url))+sec('printTitle',all.filter(l=>!l.url));
}
// data is German; English labels come from the tables above
const epochName=k=>lang==='de'?k:EPOCHS[k].en;
const typeName=k=>lang==='de'?k:(TYPES[k]||k);
const findName=f=>f.name?(lang==='de'?f.name:(NAMES[f.name]||f.name)):typeName(f.type);

function shape(type, col){
  const s='stroke="#fff" stroke-width="1.6" stroke-linejoin="round"';
  switch(type){
    case "Siedlung": case "Haus": case "vermutete Siedlung":
      return `<svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 11 L11 3 L19 11 V19 H3 Z" fill="${type==='Siedlung'?col:'#fff'}" ${type==='Siedlung'?s:`stroke="${col}" stroke-width="2.4" stroke-linejoin="round"`}/></svg>`;
    case "Grab":
      return `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 1.5 L17.4 5.75 V14.25 L10 18.5 L2.6 14.25 V5.75 Z" fill="${col}" ${s}/><circle cx="10" cy="10" r="2.4" fill="#fff"/></svg>`;
    case "Produktionsstätte":
      return `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2 L18.5 17.5 H1.5 Z" fill="${col}" ${s}/></svg>`;
    case "Hortfund":
      return `<svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" fill="${col}" ${s}/></svg>`;
    case "Kirche":
      return `<svg width="22" height="22" viewBox="0 0 22 22"><path d="M9 2 H11 V4 H13 V6 H11 V8 L15 11 V20 H5 V11 L9 8 V6 H7 V4 H9 Z" fill="${col}" ${s}/></svg>`;
    case "Schloss":
      return `<svg width="22" height="22" viewBox="0 0 22 22"><path d="M2 20 V6 H5 V9 H8 V6 H11 V9 H14 V6 H17 V9 H20 V20 Z" fill="${col}" ${s}/></svg>`;
    case "Schanze":
      return `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M6 3 H14 L16 18 H4 Z" fill="${col}" ${s}/><path d="M7 9 H13 M6.5 13 H13.5" stroke="#fff" stroke-width="1.4"/></svg>`;
    case "Grenzstation":
      return `<svg width="22" height="22" viewBox="0 0 22 22"><path d="M2 10 L11 3 L20 10 V19 H2 Z" fill="${col}" ${s}/><rect x="9" y="12" width="4" height="7" fill="#fff"/></svg>`;
    case "Birnbaum":
      return `<svg width="22" height="24" viewBox="0 0 22 24"><circle cx="11" cy="9" r="7.5" fill="${col}" ${s}/><rect x="9.6" y="15" width="2.8" height="8" fill="${col}" stroke="#fff" stroke-width="1"/></svg>`;
    default:
      return `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="${col}" ${s}/></svg>`;
  }
}

const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});

FINDS.forEach(f=>{

  const icon = L.divIcon({className:'fm',html:shape(f.type,col),iconSize:[22,22],iconAnchor:[11,11],popupAnchor:[0,-10]});

function popupHtml(f){
  const ep=EPOCHS[f.epoch];
  let dist='';
  if(me){const d=haversine(me.lat,me.lng,f.lat,f.lon);dist=`<div><b>${fmtDist(d)}</b> ${t('ofYou',{dir:compass(bearing(me.lat,me.lng,f.lat,f.lon))})}</div>`;}
  const g=`${f.lat.toFixed(5)},${f.lon.toFixed(5)}`;
  // in English, keep the German term in brackets so it can be matched to the board
  const orig=k=>lang==='de'?'':` <span class="muted">(${k})</span>`;
  return `<h3>${f.name?findName(f):(typeName(f.type)+' · '+epochName(f.epoch))}</h3>
  <div><span class="sw" style="display:inline-block;vertical-align:-1px;background:${ep.c}"></span> ${epochName(f.epoch)}${orig(f.epoch)}</div>
  <div>${typeName(f.type)}${orig(f.type)}</div>
  ${dist}
  <div class="muted">${g} · ±50 m · #${f.id}</div>
  <div class="priv">${t('privNote')}</div>
  ${litHtml(f)}
  <div style="margin-top:6px"><a href="https://www.google.com/maps/dir/?api=1&destination=${g}&travelmode=walking" target="_blank" rel="noopener">${t('walk')}</a> · <a href="https://www.openstreetmap.org/?mlat=${f.lat}&mlon=${f.lon}#map=18/${f.lat}/${f.lon}" target="_blank" rel="noopener">OSM ↗</a></div>`;
}

const filtersEl=document.getElementById('filters');
function renderFilters(){
 filtersEl.innerHTML='';
 Object.entries(EPOCHS).forEach(([k,v])=>{
  const n=FINDS.filter(f=>f.epoch===k).length; if(!n) return;
  const c=document.createElement('span');c.className='chip'+(active.has(k)?'':' off');c.title=lang==='de'?v.en:k;
  c.innerHTML=`<span class="sw" style="background:${v.c}"></span>${epochName(k)} <span class="muted">${n}</span>`;
  c.onclick=()=>{ if(active.has(k)){active.delete(k);c.classList.add('off')}else{active.add(k);c.classList.remove('off')} applyFilter(); };
  c.ondblclick=()=>{ active.clear(); active.add(k); [...filtersEl.children].forEach(x=>x.classList.add('off')); c.classList.remove('off'); applyFilter(); };
  filtersEl.appendChild(c);
 });
}
function applyFilter(){
  FINDS.forEach(f=>{const m=markers.get(f.id); if(active.has(f.epoch)) m.addTo(map); else m.remove();});
  renderList();
}

// ---------- geo helpers ----------
function haversine(a,b,c,d){const R=6371000,r=Math.PI/180;const x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b,c,d){const r=Math.PI/180;const y=Math.sin((d-b)*r)*Math.cos(c*r);const x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);return (Math.atan2(y,x)/r+360)%360;}
function compass(b){return t('compass')[Math.round(b/45)%8];}
function fmtDist(m){return m<1000?Math.round(m/5)*5+' m':(m/1000).toFixed(m<10000?2:1).replace('.',lang==='de'?',':'.')+' km';}

// ---------- list ----------
const listEl=document.getElementById('list');
function renderList(){
  let rows=FINDS.filter(f=>active.has(f.epoch)).map(f=>({f,d:me?haversine(me.lat,me.lng,f.lat,f.lon):null,b:me?bearing(me.lat,me.lng,f.lat,f.lon):0}));
  if(me) rows.sort((a,b)=>a.d-b.d);
  document.getElementById('sheetTitle').textContent = t(me?'nearestTitle':'findsTitle',{n:rows.length});
  listEl.innerHTML='';
  rows.slice(0, me?40:200).forEach(({f,d,b})=>{
    const el=document.createElement('div');el.className='item';
    el.innerHTML=`<span class="sw" style="background:${EPOCHS[f.epoch].c}"></span><span>${findName(f)}<br><span class="muted">${epochName(f.epoch)}${f.name?' · '+typeName(f.type):''}</span></span>`+
      (me?`<span class="d"><span class="arrow" style="transform:rotate(${b}deg)">↑</span> ${fmtDist(d)}</span>`:'');
    el.onclick=()=>{following=false;setBtn('btnFollow',false);map.setView([f.lat,f.lon],Math.max(map.getZoom(),17));markers.get(f.id).openPopup(); if(innerWidth<900) sheet.classList.add('collapsed');};
    listEl.appendChild(el);
  });
}

let me=null, meMarker=null, accCircle=null, watchId=null, following=false, alertOn=false;
const alerted=new Set(); const ALERT_RADIUS=75;
const statusEl=document.getElementById('status');
const topEl=document.getElementById('top');
// status is kept as a function so it can be re-rendered after a language switch
let statusFn=()=>t('statusOff');
// quiet: nothing worth showing on phones, where the status line is then hidden
function setStatus(fn,quiet){statusFn=fn;statusEl.innerHTML=fn();topEl.classList.toggle('quiet',!!quiet);}
function locateLabel(){document.getElementById('btnLocate').textContent=t(watchId!==null?'stopGps':'locate');}
function setBtn(id,on){document.getElementById(id).classList.toggle('on',on);}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',3500);}

function updatePosition(lat,lng,acc,simulated){
  me={lat,lng};
  if(!meMarker){
    meMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);
    accCircle=L.circle([lat,lng],{radius:acc||0,color:'#1a73e8',weight:1,fillOpacity:.08}).addTo(map);
  } else {meMarker.setLatLng([lat,lng]);accCircle.setLatLng([lat,lng]).setRadius(acc||0);}
  const near=FINDS.filter(f=>active.has(f.epoch)).map(f=>({f,d:haversine(lat,lng,f.lat,f.lon)})).sort((a,b)=>a.d-b.d);
  const n100=near.filter(x=>x.d<=100).length, n500=near.filter(x=>x.d<=500).length;
  const nearest=near[0];
  setStatus(()=>(simulated?`<span class="muted">${t('testPos')}</span>`:'') +
    (acc?`GPS ±<b>${Math.round(acc)} m</b> · `:'') +
    t('within',{a:n100,b:n500}) +
    (nearest?'<br>'+t('nearest',{name:findName(nearest.f),epoch:epochName(nearest.f.epoch),d:fmtDist(nearest.d),dir:compass(bearing(lat,lng,nearest.f.lat,nearest.f.lon))}):''));
  if(following) map.setView([lat,lng],Math.max(map.getZoom(),16));
  if(alertOn){
    near.filter(x=>x.d<=ALERT_RADIUS && !alerted.has(x.f.id)).forEach(x=>{
      alerted.add(x.f.id);
      toast(t('nearToast',{name:findName(x.f),epoch:epochName(x.f.epoch),d:fmtDist(x.d)}));
      try{navigator.vibrate&&navigator.vibrate([150,80,150]);}catch(e){}
    });
  }
  renderList();
}

document.getElementById('btnLocate').onclick=()=>{
  if(!('geolocation' in navigator)){setStatus(()=>t('noGeo'));return;}
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;setBtn('btnLocate',false);locateLabel();setStatus(()=>t('stopped'),true);return;}
  setStatus(()=>t('waiting'));
  following=true;setBtn('btnFollow',true);
  watchId=navigator.geolocation.watchPosition(
    p=>updatePosition(p.coords.latitude,p.coords.longitude,p.coords.accuracy,false),
    e=>{setStatus(()=>t('unavail',{m:e.message})+(location.protocol==='http:'?t('needsHttps'):''));},
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  locateLabel();
};
document.getElementById('btnFollow').onclick=()=>{following=!following;setBtn('btnFollow',following);if(following&&me)map.setView([me.lat,me.lng],Math.max(map.getZoom(),16));};
document.getElementById('btnAlert').onclick=()=>{alertOn=!alertOn;setBtn('btnAlert',alertOn);alerted.clear();toast(alertOn?t('alertOn',{r:ALERT_RADIUS}):t('alertOff'));if(me)updatePosition(me.lat,me.lng,accCircle&&accCircle.getRadius(),watchId===null);};
map.on('dragstart',()=>{if(following){following=false;setBtn('btnFollow',false);}});
map.on('contextmenu',e=>{ if(watchId!==null) return; updatePosition(e.latlng.lat,e.latlng.lng,0,true); });

const sheet=document.getElementById('sheet');
document.getElementById('sheetHead').onclick=()=>{sheet.classList.toggle('collapsed');document.getElementById('sheetToggle').textContent=sheet.classList.contains('collapsed')?'▴':'▾';};
if(innerWidth<900) sheet.classList.add('collapsed');
const info=document.getElementById('info');
const btnMenu=document.getElementById('btnMenu');
function setMenu(open){topEl.classList.toggle('open',open);btnMenu.setAttribute('aria-expanded',open);btnMenu.textContent=open?'✕':'☰';}
btnMenu.onclick=()=>setMenu(!topEl.classList.contains('open'));
map.on('click dragstart',()=>setMenu(false));
topEl.classList.add('quiet');
// keep the zoom/layer controls just below the top panel on phones
new ResizeObserver(()=>document.documentElement.style.setProperty('--topH',topEl.offsetHeight+'px')).observe(topEl);
document.getElementById('btnInfo').onclick=()=>info.style.display='flex';
document.getElementById('btnInfoClose').onclick=()=>info.style.display='none';
info.onclick=e=>{if(e.target===info)info.style.display='none';};

// ---------- language ----------
function applyLang(){
  document.documentElement.lang=lang;
  document.title=t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll('#btnLang [data-l]').forEach(el=>el.classList.toggle('cur',el.dataset.l===lang));
  document.getElementById('btnLang').title=t('langBtn');
  document.getElementById('btnInfo').title=t('about');
  btnMenu.title=t('menu');btnMenu.setAttribute('aria-label',t('menu'));
  locateLabel();
  statusEl.innerHTML=statusFn();
  renderFilters(); renderList(); renderLayers();
  road.setTooltipContent(t('roadTip'));
  FINDS.forEach(f=>{const m=markers.get(f.id),ttl=`${epochName(f.epoch)} – ${findName(f)}`;m.options.title=ttl;if(m._icon)m._icon.title=ttl;
    if(m.isPopupOpen()){m.closePopup();m.openPopup();}});
}
document.getElementById('btnLang').onclick=()=>{
  lang=lang==='de'?'en':'de';
  try{localStorage.setItem('lang',lang);}catch(e){}
  applyLang();
};

map.fitBounds(L.latLngBounds(FINDS.map(f=>[f.lat,f.lon])).pad(0.08));
applyLang();
</script>
</body>
</html>
